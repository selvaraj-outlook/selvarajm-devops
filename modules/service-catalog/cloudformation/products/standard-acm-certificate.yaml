AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Acme standard ACM certificate - Service Catalog product. DNS-validated,
  auto-creates its own validation record in the curated hosted zone (same
  allowlist as the standard-route53-record product) - CloudFormation handles
  this natively via DomainValidationOptions + HostedZoneId, no custom
  resource needed.

Parameters:
  DomainName:
    Type: String
    AllowedValues:
      - app.example.com
    Description: >-
      Must match an entry in the DomainHostedZones mapping below AND the
      launch role's Route53 permissions in constraints.tf (same allowlist
      standard-route53-record.yaml uses) - DNS auto-validation needs
      route53:ChangeResourceRecordSets on that zone.
  SubjectName:
    Type: String
    Description: 'Full certificate subject, e.g. myapp.app.example.com or *.app.example.com'

Mappings:
  DomainHostedZones:
    app.example.com:
      HostedZoneId: Z0000000000EXAMPLE

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SubjectName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SubjectName
          HostedZoneId: !FindInMap [DomainHostedZones, !Ref DomainName, HostedZoneId]
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

Outputs:
  CertificateArn:
    Value: !Ref Certificate
