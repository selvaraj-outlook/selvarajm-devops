# MLflow model: no scoring script or environment needed (no-code deployment).
# The pipeline creates "blue" and "green" from this file with --name and
# --set model=..., then shifts traffic between them.
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: breast-cancer-ep
model: azureml:breast-cancer-rf@latest
instance_type: Standard_DS3_v2
instance_count: 1
request_settings:
  request_timeout_ms: 5000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
readiness_probe:
  initial_delay: 30
