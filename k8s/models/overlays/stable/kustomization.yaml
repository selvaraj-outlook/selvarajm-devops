# All traffic on the current stable version.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: InferenceService
      name: wine-classifier
    patch: |-
      - op: replace
        path: /spec/predictor/model/storageUri
        value: s3://code-eks-models-255694842578-us-west-2/wine-classifier/v1
