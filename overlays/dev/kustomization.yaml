apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpu-inference-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gpu-platform
      app.kubernetes.io/environment: dev
      app.kubernetes.io/managed-by: kustomize
# No `images:` block. The account ID and image tag are supplied at deploy time:
#
#   kustomize edit set image vllm/vllm-openai=<registry>/<repo>:<tag>
#
# Deliberately unpinned: hardcoding a registry ties the repo to one AWS account,
# and a floating `latest` tag renders an unpullable image when nothing pushes it.
# The workflow sets the full reference from the account it authenticated into.
patches:
  - target:
      kind: ConfigMap
      name: gpu-inference-config
    patch: |-
      - op: replace
        path: /data/GPU_MEMORY_UTILIZATION
        value: "0.90"
      - op: replace
        path: /data/MAX_MODEL_LEN
        value: "4096"
